name: Build Chinese plugin packages

on:
  push:
    branches: [main]
    paths:
      - "upstream.lock.json"
      - "plugins/**"
      - "translations/**"
      - "scripts/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build localized packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --all
      - name: Build site data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site_data.py
      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: ${{ vars.SITE_DOMAIN }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cn-${{ github.sha }}
          name: 中文插件包
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*/*.zip
            dist/*/report.json
