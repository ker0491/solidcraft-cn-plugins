name: Build Chinese plugin packages

on:
  push:
    branches: [main]
    paths:
      - "upstream.lock.json"
      - "plugins/**"
      - "translations/**"
      - "scripts/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build localized packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --all
      - name: Build site data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site_data.py
      - name: Deploy site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: ${{ vars.SITE_DOMAIN }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cn-${{ github.sha }}
          name: 中文插件包
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*/*.zip
            dist/reports.json
      - name: Deploy site to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete --exclude='w911/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            site/ "$VPS_USER@$VPS_HOST:/var/www/solidcraft/"
